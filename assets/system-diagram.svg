<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style> .box{fill:#f6f9ff;stroke:#2b6cb0;stroke-width:2} .text{font-family:Arial;font-size:12px;fill:#0b3b5a} .title{font-weight:700;font-size:14px}</style>
  <rect class="box" x="40" y="30" width="160" height="60" rx="6"/>
  <text class="text title" x="120" y="60" text-anchor="middle">End Users</text>
  <rect class="box" x="240" y="20" width="220" height="80" rx="6"/>
  <text class="text title" x="350" y="50" text-anchor="middle">Blazor WebAssembly</text>

  <rect class="box" x="520" y="20" width="220" height="80" rx="6"/>
  <text class="text title" x="630" y="50" text-anchor="middle">.NET Backend API</text>

  <line x1="200" y1="60" x2="240" y2="60" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="60" x2="520" y2="60" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="box" x="140" y="140" width="160" height="70" rx="6"/>
  <text class="text" x="220" y="175" text-anchor="middle">Azure SQL</text>

  <rect class="box" x="320" y="140" width="160" height="70" rx="6"/>
  <text class="text" x="400" y="175" text-anchor="middle">Azure Blob</text>

  <rect class="box" x="500" y="140" width="160" height="70" rx="6"/>
  <text class="text" x="580" y="175" text-anchor="middle">Azure Functions</text>

  <rect class="box" x="680" y="140" width="160" height="70" rx="6"/>
  <text class="text" x="760" y="175" text-anchor="middle">ML.NET Service</text>

  <line x1="610" y1="100" x2="610" y2="140" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>

  <rect class="box" x="320" y="250" width="360" height="70" rx="6"/>
  <text class="text" x="500" y="285" text-anchor="middle">HMRC CDS REST API (OAuth)</text>

  <line x1="680" y1="185" x2="680" y2="250" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
  </defs>

  <text class="text" x="60" y="400">System diagram: User → Frontend → API → Storage/Jobs → HMRC</text>
</svg>